apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-twin-web
  labels:
    app: digital-twin-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-twin-web
  template:
    metadata:
      labels:
        app: digital-twin-web
    spec:
      containers:
        - name: web
          image: ghcr.io/skit-devops-2026/devops-24eskcs035:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
